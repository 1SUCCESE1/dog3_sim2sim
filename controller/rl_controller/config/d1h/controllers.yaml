# This config file is used by ros2_control
/**:
  controller_manager:
    ros__parameters:
      update_rate: 400  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      d1h_rl_controller:
        type: rl_controller/RlController

  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 400  # Hz
      sensor_name: trunk_imu
      frame_id:  trunk_imu

  joint_state_broadcaster:
    ros__parameters:
      update_rate: 400  # Hz

  d1h_rl_controller:
    ros__parameters:
      update_rate: 400  # Hz
      joints:
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FL_foot_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - FR_foot_joint
      command_interfaces:
        - position
        - velocity
        - effort
        - kp
        - kd
      state_interfaces:
        - position
        - velocity
        - effort
      sensors:
        - trunk_imu
      
      # control parameters
      torque_limit: [80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0]
      wheel_indices: [3, 7]
      hip_indices: [0, 4]
      locomotion_use_lqr: true # only for 8 dof robot, 

      transform_up:
        # stand_up_policy: "transform_up_rl" 
        # if comment, disable rl transform up policy
        fold_jpos: [0.75, 1.20, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
        stand_jpos: [0.2, 1.3, -2.75, 0.0, -0.2, 1.3, -2.75, 0.0]
        fold_timer: 1.0
        stand_timer: 2.0
        # 
        ff_torque: [-10.0, 0.0, -5.0, 0.0, 10.0, 0.0, -5.0, 0.0]
        joint_kp: [160.0, 700.0, 700.0, 5.0, 160.0, 700.0, 700.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.8, 8.0, 8.0, 8.0, 0.8]
        
      transform_down:
        # policy_name: "transform_down_rl" # if comment, disable rl transform up policy
        fold_jpos: [0.2, 1.3, -2.75, 0.0, -0.2, 1.3, -2.75, 0.0]
        rl_down_timer: 3.0
        fold_timer: 3.0
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.2, 8.0, 8.0, 8.0, 0.2]
        
      joint_pd:
        joint_kp: [600.0, 400.0, 400.0, 0.0, 600.0, 400.0, 400.0, 0.0]
        joint_kd: [8.0, 8.0, 8.0, 0.8, 8.0, 8.0, 8.0, 0.8]

      rl_policy_names:
        - "transform_up_rl"
        - "rl_flat"
        - "ddt_flat"
        - "instinct_flat_19"
        - "instinct_flat_24"
        - "rl_squatdown"
        
        
      rl_flat:
        policy_path: config/d1h/flat.onnx
        output_name: "nn_output"

        # env
        num_obs: 33
        num_actions: 8
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [1.0, 0.8, 1.0]
        min_commands: [-0.5, -0.8, -1.0]
        commands_comp: [0.0, 0.0, 0.0] # direct add offset to command
        # control parameters
        time_interval: 0.01 # forward thread seconds
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 10.0, 40.0, 40.0, 40.0, 10.0]
        joint_kd: [1.2, 1.2, 1.2, 0.6, 1.2, 1.2, 1.2, 0.6]

        action_scales: [ 0.25, 0.5, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5 ]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

      ddt_flat:
        policy_path: config/d1h/ddt_flat.onnx
        output_name: "nn_output"

        # env
        num_obs: 33
        num_actions: 8
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25]
        max_commands: [1.0, 0.8, 1.0]
        min_commands: [-0.5, -0.8, -1.0]
        commands_comp: [0.0, 0.0, 0.0]
        # control parameters
        time_interval: 0.01
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 10.0, 40.0, 40.0, 40.0, 10.0]
        joint_kd: [1.2, 1.2, 1.2, 0.6, 1.2, 1.2, 1.2, 0.6]

        action_scales: [0.25, 0.5, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

      rl_squatdown:
        policy_path: config/d1h/squatdown.onnx
        output_name: "nn_output"

        # env
        num_obs: 33
        num_actions: 8
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [1.0, 1.0, 1.0]
        min_commands: [-1.0, -1.0, -1.0]
        commands_comp: [0.0, 0.0, 0.0] # direct add offset to command
        # control parameters
        time_interval: 0.01 # forward thread seconds
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 10.0, 40.0, 40.0, 40.0, 10.0]
        joint_kd: [1.0, 1.0, 1.0, 0.6, 1.0, 1.0, 1.0, 0.6]

        action_scales: [ 0.25, 0.5, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5 ]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

        # Compensation items
        output_torque_scale: 1.0

      transform_up_rl:
        policy_path: config/d1h/getup.onnx
        output_name: "nn_output"

        # env
        num_obs: 33
        num_actions: 8
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [0.0, 0.0, 0.1]
        min_commands: [-0.0, -0.0, -0.1]
        commands_comp: [0.0, 0.0, 0.0] # direct add offset to command
        # control parameters
        time_interval: 0.01 # forward thread seconds
        default_joint_angles: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.9, -2.6, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 10.0, 40.0, 40.0, 40.0, 10.0]
        joint_kd: [1.0, 1.0, 1.0, 0.6, 1.0, 1.0, 1.0, 0.6]

        action_scales: [0.25, 0.5, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

        # Compensation items
        output_torque_scale: 1.0

      # InstinctLab export: single input [1,33], no history, observation
      # normalizer baked into the ONNX graph (Sub -> Add -> Div).  Feed scaled
      # obs only; the single-input path in FSMState_RL::update_forward handles
      # the 1-input model.
      instinct_flat_19:
        policy_path: config/d1h/instinct_flat_19.onnx
        output_name: "output"
        policy_type: "instinctlab"
        # env
        num_obs: 33
        num_actions: 8
        history_len: 0
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [1.0, 0.8, 1.0]
        min_commands: [-0.5, -0.8, -1.0]
        commands_comp: [0.0, 0.0, 0.0] # direct add offset to command
        # control parameters
        time_interval: 0.01 # forward thread seconds
        # P_V: wheel joints use velocity control (qd_dot = action*scale);
        # works in gazebo (MIT formula tau = kd*(qd_dot - dq)).  NOT supported on
        # real motor firmware (kp=0,kd>0 is an undefined mode) — use P + the
        # software velocity loop on the robot instead.
        # control_type: "P"
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 0.0, 40.0, 40.0, 40.0, 0.0]
        joint_kd: [1.20, 1.20, 1.20, 0.6, 1.20, 1.20, 1.20, 0.6]
        #joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        #joint_kd: [2.0, 2.0, 2.0, 1.0, 2.0, 2.0, 2.0, 1.0]

        action_scales: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05
       # Latest InstinctLab run 20260814_103126 (normalizer baked at export).
      instinct_flat_24:
        policy_path: config/d1h/instinct_flat_24.onnx
        output_name: "output"
        policy_type: "instinctlab"
        # env
        # instinct_flat_24 -> 20260826_234634 (2026-08-27); instinct_flat_19.onnx holds
        # the original 150447 policy again.
        num_obs: 33
        num_actions: 8
        history_len: 0
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [1.0, 0.8, 1.0]
        min_commands: [-0.5, -0.8, -1.0]
        commands_comp: [0.0, 0.0, 0.0] # direct add offset to command
        # control parameters
        time_interval: 0.01 # forward thread seconds
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0]
        # Wheel joint_kd is the SOFTWARE velocity-loop gain
        #   tau = joint_kd * (action*action_scale - dq)
        # matching training wheel ImplicitActuator damping.  Wheel joint_kp
        # is unused in P mode (pure torque).
        # Leg gains reverted 60/2 -> 40/1 (2026-08-24): 60/2 did not raise the deployed
        # height and made the legs more active. Low deployed height is not leg sag.
        # Wheel joint_kd 1.0 reverted -> 0.3 (2026-08-25): 1.0 made the legs shake
        # violently. Leg kd 1 -> 2 (matches training damping 2.0) to calm the excess
        # leg adjustment; kp stays 40.
        #joint_kp: [40.0, 40.0, 40.0, 0.0, 40.0, 40.0, 40.0, 0.0]
        #joint_kd: [1.20, 1.20, 1.20, 0.6, 1.20, 1.20, 1.20, 0.6]
        joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        joint_kd: [2.0, 2.0, 2.0, 1.0, 2.0, 2.0, 2.0, 1.0]

        action_scales: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05      
